[package]
name = "sic-experiments"
version = "0.1.3"
edition = "2024"
description = "Paper-support experiment helpers kept out of the SIC core crate"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sic-core-rust = { path = "../rust-core" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
