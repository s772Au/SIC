name: SIC core verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      LITELLM_TELEMETRY: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ".[full]"
      - name: Core tests with owned loopback providers
        run: python scripts/check_core_v2.py --require-sdk
      - name: DSH protocol and independent scoring tests
        run: python -m unittest tests.test_dsh_live_smoke benchmarks.test_dsh_live_runner -v
      # Source-locked LME/processor and real DSH installations are separate
      # acceptance environments. Missing optional fixtures are reported as skips.
