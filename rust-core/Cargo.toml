[package]
name = "sic-core-rust"
version = "0.1.1"
edition = "2024"
description = "Rust implementation of streaming incremental context editing"
license = "MIT"

[lib]
name = "sic_core_rust"
path = "src/lib.rs"

[[bin]]
name = "sic-core-rust"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tiktoken-rs = "0.12.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
