[package]
name = "sic-transparent-native-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# Compile the actual protocol/transaction modules without the SQL Core. This
# fixture never opens a database, loads a profile or contacts an external host.
[workspace]

[[test]]
name = "transparent_native"
path = "../../tests/transparent_native.rs"

[[test]]
name = "protocol_regression"
path = "../../tests/protocol.rs"

[dependencies]
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
