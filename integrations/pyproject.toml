[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sic-workflow-integrations"
version = "0.1.0"
description = "Official Langflow and LangGraph control planes for the SIC v2 core"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
langflow = ["langflow-base==1.13.1"]
graph = ["langgraph==1.2.20"]
studio = ["langgraph==1.2.20", "langgraph-cli[inmem]==0.4.42", "langgraph-api==0.17.1", "langgraph-sdk==0.4.14", "starlette==1.10.0", "colorama==0.4.6; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["sic_workflow*"]
