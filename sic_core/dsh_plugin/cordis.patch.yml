- insert:
    - id: sic-core-dsh
      name: ./index.mjs
      config:
        provider: sic-core
        baseURL: http://127.0.0.1:18890/v1
        apiKeyEnv: SIC_CORE_TOKEN
        model: sic-worker
        contextWindow: 128000
        maxTokens: 4096
        inputPricePerMillion: 0
        outputPricePerMillion: 0
        cacheReadPricePerMillion: 0
        cacheWritePricePerMillion: 0
        toolEvents: true
