[workspace]
members = ["rust-core", "experiments"]
resolver = "2"
exclude = ["rust-core/vendor/sqlx-sqlite-0.8.6"]

[profile.release]
debug = 0
strip = "symbols"
incremental = false

# SQLx 0.8.6 driver with a dependency-only patched SQLite update.
[patch.crates-io]
sqlx-sqlite = { path = "rust-core/vendor/sqlx-sqlite-0.8.6" }
